    <path d="M490 772 q0 -14 14 -14" stroke="#062c2a" stroke-width="5" fill="none"/>
    <circle cx="506" cy="762" r="7" fill="#ffe2a8"/>
    <circle cx="506" cy="762" r="60" fill="url(#glow)"/>

    <!-- House C: apartment block -->
    <rect x="530" y="580" width="262" height="360" fill="#0b4a47"/>
    <rect x="522" y="568" width="278" height="14" fill="#083936"/>
    <g>
      <rect x="552" y="608" width="44" height="40" fill="#0e3f3c"/>
      <rect x="626" y="608" width="44" height="40" fill="#f4c877"/>
      <rect x="700" y="608" width="44" height="40" fill="#0e3f3c"/>
      <rect x="552" y="676" width="44" height="40" fill="#f4c877"/>
      <rect x="626" y="676" width="44" height="40" fill="#9fd0d8" opacity=".8"/>
      <rect x="700" y="676" width="44" height="40" fill="#f4c877"/>
      <rect x="552" y="744" width="44" height="40" fill="#0e3f3c"/>
      <rect x="626" y="744" width="44" height="40" fill="#f4c877"/>
      <rect x="700" y="744" width="44" height="40" fill="#0e3f3c"/>
      <rect x="552" y="812" width="44" height="40" fill="#f4c877"/>
      <rect x="626" y="812" width="44" height="40" fill="#0e3f3c"/>
    </g>
    <rect x="708" y="856" width="50" height="84" fill="#f0c27a" opacity=".85"/>
    <!-- a neighbour waving from her window -->
    <circle cx="722" cy="688" r="8" fill="#9c6646"/>
    <path d="M710 716 q12 -18 24 0 Z" fill="#2f7d74"/>
    <path d="M732 700 l8 -14" stroke="#9c6646" stroke-width="4" stroke-linecap="round"/>

    <!-- Street -->
    <rect x="-400" y="940" width="1600" height="12" fill="#0a3a37"/>
    <rect x="-400" y="952" width="1600" height="60" fill="#052826"/>

    <!-- Son walking home with groceries -->
    <g>
      <circle cx="452" cy="866" r="12" fill="#a86d4a"/>
      <path d="M440 862 q12 -16 24 0 q-2 -10 -12 -10 q-10 0 -12 10 Z" fill="#1a1a1a"/>
      <path d="M437 882 q15 -6 30 0 l4 46 h-38 Z" fill="#f1e6d2"/>
      <path d="M441 928 l-6 30 M463 928 l8 30" stroke="#1f3533" stroke-width="9" stroke-linecap="round"/>
      <path d="M467 890 l12 22" stroke="#a86d4a" stroke-width="6" stroke-linecap="round"/>
      <rect x="472" y="908" width="22" height="26" rx="3" fill="#e9a66b"/>
      <path d="M477 908 q6 -9 12 0" stroke="#c9743f" stroke-width="2.5" fill="none"/>
      <path d="M487 916 l4 6" stroke="#2f7d74" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Check-in bubble above the balcony -->
    <path d="M156 548 h78 a10 10 0 0 1 10 10 v28 a10 10 0 0 1 -10 10 h-56 l-14 12 l2 -12 h-10 a10 10 0 0 1 -10 -10 v-28 a10 10 0 0 1 10 -10 Z" fill="#fff6e8"/>
    <path d="M178 584 C164 574 166 560 174 562 C177 563 178 566 178 568 C178 566 179 563 182 562 C190 560 192 574 178 584 Z" fill="#b9572f"/>
    <path d="M204 572 l6 6 l12 -14" stroke="#17663a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Threads of care linking the people -->
    <g fill="none" stroke="#ffd58f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10" opacity=".85">
      <path d="M152 636 C 260 600 330 760 446 852"/>
      <path d="M152 636 C 320 520 560 560 716 684"/>
      <path d="M460 856 C 540 800 620 760 648 696"/>
    </g>
    <g fill="#ffd58f">
      <circle cx="446" cy="852" r="4"/><circle cx="716" cy="684" r="4"/><circle cx="648" cy="696" r="4"/>
    </g>
  </g>

</svg>
