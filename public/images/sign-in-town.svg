<svg xmlns="http://www.w3.org/2000/svg" viewBox="-400 520 1600 480" preserveAspectRatio="xMidYMax slice">
  <!-- LifeSphere sign-in illustration, town layer: a mother checks in from her balcony, her son walks home, a neighbour waves. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062f2d"/>
      <stop offset=".55" stop-color="#0d5c58"/>
      <stop offset="1" stop-color="#1b6a60"/>
    </linearGradient>
    <radialGradient id="dusk" cx="400" cy="880" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3a660" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#c9703f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c9703f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" r=".5">
      <stop offset="0" stop-color="#ffd58f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd58f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" r=".5">
      <stop offset="0" stop-color="#fbe9c2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fbe9c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd58f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd58f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g fill="#0b4e4a" opacity=".75">
    <path d="M-400 760 V690 h90 v-40 h60 v110 Z"/><path d="M-240 760 V670 h120 v90 Z"/><path d="M-110 760 V700 h110 v60 Z"/>
    <path d="M800 760 V680 h120 v80 Z"/><path d="M930 760 V640 h70 v120 Z"/><path d="M1010 760 V690 h18 l22 -40 l22 40 h18 v70 Z"/><path d="M1100 760 V670 h100 v90 Z"/>
  </g>
  <g transform="translate(0 18)">
    <rect x="-380" y="640" width="170" height="300" fill="#0a4542"/><rect x="-388" y="626" width="186" height="16" fill="#083936"/>
    <rect x="-350" y="680" width="40" height="44" fill="#f4c877"/><rect x="-280" y="680" width="40" height="44" fill="#0e3f3c"/>
    <rect x="-350" y="770" width="40" height="44" fill="#0e3f3c"/><rect x="-280" y="770" width="40" height="44" fill="#f4c877"/>
    <rect x="-190" y="760" width="160" height="180" fill="#0d4d49"/><path d="M-200 762 L-110 706 L-20 762 Z" fill="#8a4126"/>
    <rect x="-165" y="800" width="38" height="38" fill="#f4c877"/><rect x="-100" y="830" width="40" height="110" fill="#072f2d"/>
    <rect x="812" y="660" width="170" height="280" fill="#0d4d49"/><rect x="804" y="646" width="186" height="16" fill="#083936"/>
    <rect x="836" y="690" width="40" height="40" fill="#f4c877"/><rect x="906" y="690" width="40" height="40" fill="#0e3f3c"/>
    <rect x="836" y="760" width="40" height="40" fill="#0e3f3c"/><rect x="906" y="760" width="40" height="40" fill="#f4c877"/>
    <rect x="1010" y="770" width="180" height="170" fill="#0a4542"/><path d="M1000 772 L1100 712 L1200 772 Z" fill="#8a4126"/>
    <rect x="1035" y="810" width="40" height="40" fill="#f4c877"/><rect x="1120" y="830" width="44" height="110" fill="#f8d28a" opacity=".9"/>
