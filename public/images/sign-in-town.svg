    <path d="M262 724 L372 656 L482 724 Z" fill="#8a4126"/>
    <path d="M262 724 L372 656 L482 724" stroke="#a9532f" stroke-width="6" fill="none"/>
    <rect x="272" y="722" width="200" height="218" fill="#0d4d49"/>
    <rect x="292" y="772" width="42" height="42" fill="#f4c877"/>
    <rect x="414" y="772" width="42" height="42" fill="#0a3a37"/>
