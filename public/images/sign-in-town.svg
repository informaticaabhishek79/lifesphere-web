    <circle cx="120" cy="620" r="14" fill="#b07651"/>
    <path d="M106 616 q14 -16 28 0 q-4 -8 -14 -9 q-10 1 -14 9 Z" fill="#d8d2c8"/>
    <path d="M98 690 L102 646 q18 -12 36 0 L142 690 Z" fill="#b9572f"/>
    <path d="M104 648 q14 -6 32 2 l-30 40 h-8 Z" fill="#e9a66b" opacity=".85"/>
    <path d="M136 652 q10 4 10 -10" stroke="#b07651" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="141" y="628" width="10" height="16" rx="2" fill="#fff6e0"/>
    <circle cx="146" cy="636" r="18" fill="url(#glow)"/>
