    <rect x="166" y="770" width="52" height="60" fill="#f4c877"/>
    <g stroke="#0a4542" stroke-width="3"><path d="M68 770 V830 M42 800 H94 M192 770 V830 M166 800 H218"/></g>
    <rect x="104" y="820" width="52" height="120" fill="#072f2d"/>
    <circle cx="146" cy="882" r="2.5" fill="#f4c877"/>

